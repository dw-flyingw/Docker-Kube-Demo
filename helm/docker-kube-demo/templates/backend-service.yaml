apiVersion: v1
kind: Service
metadata:
  name: {{ include "docker-kube-demo.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "docker-kube-demo.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
      protocol: TCP
  selector:
    {{- include "docker-kube-demo.selectorLabels" . | nindent 4 }}
