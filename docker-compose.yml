version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app # Mount the local frontend directory to /app in the container
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
